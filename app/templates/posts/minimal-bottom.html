<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family={{ font_family_url }}:wght@400;700;900&amp;display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: {{ width }}px;
      height: {{ height }}px;
      overflow: hidden;
      font-family: '{{ font_family }}', 'Montserrat', sans-serif;
    }
    .canvas {
      position: relative;
      width: {{ width }}px;
      height: {{ height }}px;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 20%;
      background: {{ primary_color }};
      display: flex;
      align-items: center;
      padding: 0 48px;
      gap: 24px;
    }
    .logo {
      max-height: 48px;
      max-width: 120px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .bar-text {
      flex: 1;
      min-width: 0;
    }
    .headline {
      font-size: {{ (width * 0.038) | int }}px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cta {
      font-size: {{ (width * 0.024) | int }}px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.82);
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="{{ background_image | safe }}" alt="">
    <div class="bottom-bar">
      {% if logo_url %}<img class="logo" src="{{ logo_url | safe }}" alt="Logo">{% endif %}
      <div class="bar-text">
        <div class="headline">{{ headline }}</div>
        {% if cta %}<div class="cta">{{ cta }}</div>{% endif %}
      </div>
    </div>
  </div>
</body>
</html>
