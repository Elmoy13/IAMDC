<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family={{ font_family_url }}:wght@400;700;900&amp;display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: {{ width }}px;
      height: {{ height }}px;
      overflow: hidden;
      font-family: '{{ font_family }}', 'Montserrat', sans-serif;
    }
    .canvas {
      position: relative;
      width: {{ width }}px;
      height: {{ height }}px;
      background: #000;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.88) 0%,
        rgba(0, 0, 0, 0.35) 45%,
        rgba(0, 0, 0, 0.08) 100%
      );
    }
    .logo {
      position: absolute;
      top: 48px;
      left: 48px;
      max-height: 64px;
      max-width: 180px;
      object-fit: contain;
    }
    .content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 72px 80px;
      text-align: center;
    }
    .headline {
      font-size: {{ (width * 0.072) | int }}px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }
    .cta {
      display: inline-block;
      background: {{ primary_color }};
      color: #fff;
      font-size: {{ (width * 0.032) | int }}px;
      font-weight: 700;
      padding: 16px 44px;
      border-radius: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="{{ background_image | safe }}" alt="">
    <div class="overlay"></div>
    {% if logo_url %}<img class="logo" src="{{ logo_url | safe }}" alt="Logo">{% endif %}
    <div class="content">
      <div class="headline">{{ headline }}</div>
      {% if cta %}<div class="cta">{{ cta }}</div>{% endif %}
    </div>
  </div>
</body>
</html>
