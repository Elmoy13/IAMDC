<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family={{ font_family_url }}:wght@400;700;900&amp;display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: {{ width }}px;
      height: {{ height }}px;
      overflow: hidden;
      font-family: '{{ font_family }}', 'Montserrat', sans-serif;
    }
    .canvas {
      display: flex;
      width: {{ width }}px;
      height: {{ height }}px;
    }
    .panel {
      width: 40%;
      height: 100%;
      background: {{ primary_color }};
      display: flex;
      flex-direction: column;
      padding: 56px 48px;
      flex-shrink: 0;
    }
    .logo {
      max-height: 56px;
      max-width: 160px;
      object-fit: contain;
      align-self: flex-start;
    }
    .spacer { flex: 1; }
    .text-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .headline {
      font-size: {{ (width * 0.048) | int }}px;
      font-weight: 900;
      color: #fff;
      line-height: 1.15;
      letter-spacing: -0.3px;
    }
    .body {
      font-size: {{ (width * 0.026) | int }}px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.55;
    }
    .cta {
      display: inline-block;
      align-self: flex-start;
      background: #fff;
      color: {{ primary_color }};
      font-size: {{ (width * 0.026) | int }}px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }
    .image-side {
      flex: 1;
      height: 100%;
      overflow: hidden;
    }
    .image-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="panel">
      {% if logo_url %}
        <img class="logo" src="{{ logo_url | safe }}" alt="Logo">
      {% else %}
        <div style="height: 56px;"></div>
      {% endif %}
      <div class="spacer"></div>
      <div class="text-content">
        <div class="headline">{{ headline }}</div>
        {% if body %}<div class="body">{{ body }}</div>{% endif %}
        {% if cta %}<div class="cta">{{ cta }}</div>{% endif %}
      </div>
    </div>
    <div class="image-side">
      <img src="{{ background_image | safe }}" alt="">
    </div>
  </div>
</body>
</html>
